[package]
name = "sdkwork-birdcoder-pc-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.16"
sdkwork-api-birdcoder-standalone-gateway = { workspace = true }
sdkwork-birdcoder-tauri-host = { workspace = true }
sdkwork-models-user-config-repository-sqlx = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "~2.11.0", features = [] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4.2", features = ["deep-link"] }

[lib]
name = "sdkwork_birdcoder_pc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
