# SDKWork BirdCoder container compose.
#
# The Dockerfile expects the unpacked container release bundle as its build
# context (server/bin, openapi, and deploy/docker/profiles are bundle-relative
# paths). Unpack the packaged bundle first, for example:
#
#   tar -xzf artifacts/release/container/linux/x64/cpu/sdkwork-birdcoder-container-release-local-linux-x64.tar.gz -C artifacts/release/container/linux/x64/cpu/
#   docker compose -f deployments/docker/docker-compose.yml up -d
#
# The bundle-embedded compose (deploy/docker/docker-compose.yml inside the
# unpacked bundle) is the canonical launcher and is rewritten by the packager
# to reference the bundle-relative Dockerfile path.
services:
  sdkwork-birdcoder:
    build:
      context: ../../artifacts/release/container/linux/x64/cpu
      dockerfile: sdkwork-birdcoder-container-release-local-linux-x64/deploy/docker/Dockerfile
    env_file:
      - profiles/default.env
    ports:
      - "18989:18989"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:18989/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    user: "10001:10001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
