# sdkwork-birdcoder docker test domains -> container gateway.
# WSL Ubuntu host nginx. Windows hosts:
#   127.0.0.1 testapidocker.sdkwork.com testapidocker.birdcoder.com testapidocker.dtupay.com
#
# The gateway container publishes 10243:10240; the portal SPA is unpacked from
# the birdcoder image by `pnpm deploy:apply:standalone` into
# /opt/sdkwork/birdcoder/portal and served from there, while every canonical
# API prefix is proxied to the gateway. The SPA is built with the
# testapidocker.sdkwork.com application origin (see build:container), so API
# calls from all three domains land on the same gateway through CORS.

server {
    listen 80;
    listen [::]:80;
    server_name testapidocker.sdkwork.com testapidocker.birdcoder.com testapidocker.dtupay.com;

    # Shared per-IP request-rate zone for the API plane (burst smoothing;
    # the gateway also enforces its own process-local window). Keep the
    # surplus burst small so a single misbehaving client cannot monopolize
    # the proxy.
    limit_req_zone $binary_remote_addr zone=birdcoder_api:10m rate=20r/s;
    limit_req_status 429;

    access_log /var/log/nginx/testapidocker-birdcoder.access.log;
    error_log /var/log/nginx/testapidocker-birdcoder.error.log;

    # Portal SPA static delivery (built dist unpacked from the container image).
    root /opt/sdkwork/birdcoder/portal;
    index index.html;

    # Canonical API/infra prefixes proxied to the gateway container
    # (same list as the vite dev proxy).
    location ~ ^/(app|backend|api|readyz|healthz|livez|metrics|openapi\.json) {
        limit_req zone=birdcoder_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:10243;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 1100m;
    }

    # SPA history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
